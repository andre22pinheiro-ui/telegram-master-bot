# render.yaml — Arquitetura 100% Cloud-Native (Serviços Web Isolados no Render)
# Serviço 1 (0h2h): telegram-master-bot (@AndrePinheirobot -> https://telegram-master-bot-0h2h.onrender.com) -> Pessoal & Familiar (SQLite WAL + Google Drive, ZERO Supabase)
# Serviço 2 (Frota): zeropaper-frota-bot (@zeropaperfrotaBot -> https://zeropaper-frota-bot.onrender.com & https://zeropaper-frota-bot-0h2h.onrender.com) -> Trabalho & Frotas (Supabase AppFrota + ORS + CE 561/2006)

services:
  - type: web
    name: telegram-master-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: "3000"
      - key: TELEGRAM_BOT_TOKEN_MASTER
        sync: false
      - key: TELEGRAM_DEV_TOKEN
        sync: false
      - key: TELEGRAM_IMMO_TOKEN
        sync: false
      - key: TELEGRAM_PESSOAL_TOKEN
        sync: false
      - key: TELEGRAM_NUTRICAO_TOKEN
        sync: false
      - key: CHAT_ID_AUTORIZADO
        sync: false
      - key: CHAT_ID_ESPOSA
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_HOST
        value: imap.gmail.com
      - key: EMAIL_PORT
        value: "993"
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: TELEGRAM_WEBAPP_URL
        value: https://gestao-familiar-webapp.vercel.app
      - key: RENDER_EXTERNAL_URL
        value: https://telegram-master-bot-0h2h.onrender.com
      - key: VERCEL_DEPLOY_HOOK_URL
        sync: false

  - type: web
    name: zeropaper-frota-bot
    repo: https://github.com/andre22pinheiro-ui/zeropaper-frota-bot
    branch: main
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: TELEGRAM_FROTAS_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TELEGRAM_ID
        value: "950415577"
      - key: SUPABASE_URL
        value: "https://bwibtpcunojmtnrnqpvg.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: APP_BASE_URL
        value: "https://appfrota-ten.vercel.app"
      - key: ROTABUS_WEB_URL
        value: "https://smooth-bus-routes.vercel.app"
