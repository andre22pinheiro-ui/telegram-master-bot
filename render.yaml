# render.yaml — Arquitetura 100% Cloud-Native (Domínio Pessoal Isolado no Render)
# Serviço Pessoal (0h2h): telegram-master-bot (@AndrePinheirobot -> https://telegram-master-bot-0h2h.onrender.com) -> Pessoal & Familiar (SQLite WAL + Google Drive, ZERO Supabase)
# Nota: zeropaper-frota-bot tem o seu próprio render.yaml isolado em zeropaper-frota-bot.onrender.com; zeropaper-frota-bot-0h2h fica livre para reaproveitamento pessoal.

services:
  - type: web
    name: telegram-master-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: "3000"
      - key: TELEGRAM_BOT_TOKEN_MASTER
        sync: false
      - key: TELEGRAM_DEV_TOKEN
        sync: false
      - key: TELEGRAM_IMMO_TOKEN
        sync: false
      - key: TELEGRAM_PESSOAL_TOKEN
        sync: false
      - key: TELEGRAM_NUTRICAO_TOKEN
        sync: false
      - key: CHAT_ID_AUTORIZADO
        sync: false
      - key: CHAT_ID_ESPOSA
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_HOST
        value: imap.gmail.com
      - key: EMAIL_PORT
        value: "993"
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: TELEGRAM_WEBAPP_URL
        value: https://gestao-familiar-webapp.vercel.app
      - key: RENDER_EXTERNAL_URL
        value: https://telegram-master-bot-0h2h.onrender.com
      - key: VERCEL_DEPLOY_HOOK_URL
        sync: false
